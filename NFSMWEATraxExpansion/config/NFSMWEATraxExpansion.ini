; 初期設定のままで使用できます。設定名と曲名は変えず、右側の値を変更してください。
; Ready to use with defaults. Keep setting and song names unchanged; edit values only.
; 音源の用意と配置方法は、同じフォルダーのREADME.mdをご覧ください。
; See README.md in this folder for audio preparation and installation.

[Main]

; トラブル調査用ログ: true=出力、false=停止（規定）。変更後はゲームを再起動。
; Troubleshooting logs: true=on, false=off (default). Restart after changing.
Logging = false

; true: StreamerTracksの曲だけを再生。純正曲・Tracks・UG2曲は通常選曲から除外します。
; true: play only StreamerTracks songs; exclude stock songs, Tracks and UG2 songs.
; ゲーム終了中に変更し、再起動で反映。生成済みキャッシュは切り替えだけでは再生成しません。
; Change with the game closed; applies on restart. Switching reuses each prepared cache.
; 追跡BGMは通常・カスタムとも共通設定です。通常モードの純正曲設定は保持されます。
; Stock/custom pursuit music stays shared. Normal-mode stock-song settings are preserved.
StreamerMode = false

; 追加曲のArtist/Album表示を交換。起動中の変更は次回の一覧/HUD更新時に反映。
; Swap added-song Artist/Album display. Live changes apply on the next list/HUD refresh.
SwapArtistAlbum = false
; 再生停止の調査ログ。疑わしい無音を記録しますが、強制再生は行いません。
; Log playback context/suspected gaps for troubleshooting; never forces playback.
PlaybackDiagnostics = true

; 日本語の曲名・アーティスト名を表示: 1=有効、0=英字表記。日本語対応フォントが必要です。
; Show original Japanese metadata: 1=on, 0=romanized. Requires Japanese-capable game fonts.
JapaneseMetadata = 0

; MOD全体を使用する: 1=使用、0=無効。ゲーム終了中に変更してください。
; Enable this MOD: 1=on, 0=off. Change Main settings with the game closed.
Enabled = 1

; 走行中の曲名HUDを画面の縦横比に合わせて配置: 1=使用、0=無効。
; メイン／ガレージメニューの配置はそのままです。
; Adjust the in-world song HUD for the screen aspect ratio: 1=on, 0=off.
; Main and garage menu positions are preserved.
HudAspectAssist = 1

; TracksのMP3・WAV・M4Aを追加: 1=追加、0=追加しない。サブフォルダーも使用できます。
; Import MP3/WAV/M4A from Tracks: 1=yes, 0=no. Subfolders are supported.
LoadExternalTracks = 1

; UG2の27曲を追加: 1=追加、0=追加しない。UG2MusicSFxにMusicSFx.mpfとMusicSFx.musを置きます。sdat.vivからの取り出し方はREADME.mdをご覧ください。
; Import 27 UG2 songs: 1=yes, 0=no. Put MusicSFx.mpf and MusicSFx.mus in UG2MusicSFx. See README.md to extract them from sdat.viv.
LoadMusicSFx = 1

; 追加する通常曲の音量: 0.0～2.0、初期値1.0。値が大きいほど音量が上がります。変更後は再変換し、完了通知に従って起動し直してください。
; Added normal-track volume: 0.0 to 2.0, default 1.0. Higher is louder. Changing this reconverts music; restart when prompted.
VolumeMultiplier = 1.0

; 追加する通常曲の合計上限: 1～94。UG2の27曲も含みます。
; Maximum added normal tracks: 1 to 94, including the 27 UG2 songs.
MaxCustomTracks = 94

[Updates]
; 起動時にGitHubの公開版情報だけを確認: 1=有効、0=無効。自動ダウンロードは行いません。
; Check public GitHub release metadata at startup: 1=on, 0=off. No automatic downloads.
Enabled = 1
; 通知の言語: auto=ゲーム設定、Japanese=日本語、English=英語。
; Notice language: auto=game setting, Japanese or English. Other game languages use English.
Language = auto

; The Run追跡BGMは任意です。別配布コンバーターで生成するまではMW標準BGMを使用します。
; The Run pursuit music is optional. Stock MW music is used until you run the separate converter.
[Pursuit]

; HEAT 1 to 3 EA TRAX Keeping (experimental). Restart after changing this.
; Keep EA TRAX during low-heat free-roam pursuits; release pursuit music and the deferred intro at HEAT 4.
; HEAT 1～3のフリーローム追跡ではEA TRAXを継続。HEAT 4で追跡BGMと保留した開始演出を開始します。
; 試験機能です。変更後はゲームを再起動してください。追加追跡音源がなくても使用できます。
Heat1To3EATraxKeeping = false

; 追加の追跡BGMを使用: true=使用、false=MW標準のみ。変更後はゲームを起動し直してください。
; Enable extra pursuit music: true=on, false=stock MW only. Restart after changing this.
Enabled = true

; Random=MW標準と導入済みの全追跡曲から選曲。List=trueにした曲だけから選曲。どちらもランダム選曲です。
; Random=stock plus every installed pursuit score. List=only songs set to true. Both select randomly.
Mode = Random

; 特定の曲だけを使う: true=TestTrackを優先、false=通常のランダム選曲。MOD全体と追跡BGMのEnabledも有効にしてください。
; Use one score: true=TestTrack overrides song switches, false=normal random selection. Both Enabled settings must be on.
TestMode = false

; TestMode=trueのときの曲。Vanillaまたは下にある曲名をそのまま指定します。
; Score used with TestMode=true. Enter Vanilla or an exact song name from the list below.
TestTrack = Vanilla

; true=選曲に含める、false=除外。VanillaはMW標準追跡BGMです。次の追跡開始時に反映します。同じ曲が続く場合があります。全曲falseならMW標準を使用します。
; true=include, false=exclude. Vanilla means stock MW pursuit music. Applies at the next pursuit start. Repeats are possible. If all are false, stock music is used.
Vanilla = true
Battle Race Theme 2 = true
Sprint Race Theme 1 = true
Checkpoint Race Theme 3 = true
Sprint Race Theme 2 = true
Checkpoint Race Theme 2 = true
Battle Race Theme 1 = true
Survival Race Theme 3 = true
Survival Race Theme 2 = true
